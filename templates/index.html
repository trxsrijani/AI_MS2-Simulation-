<style>
    /* ===========================
   INDIAN NAVY MINIMAL THEME
   (Structure unchanged)
=========================== */

body {
    margin: 0;
    background: #0b1c2d; /* Deep Naval Blue */
    overflow: hidden;
    display: flex;
    height: 100vh;
    font-family: "Segoe UI", sans-serif;
}

/* LEFT SIDE - VIDEO (90%) */
#videoContainer {
    width: 90%;
    height: 100%;
}

#videoStream {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: black;
}

/* RIGHT SIDE - SENSOR PANEL (10%) */
#sensorPanel {
    width: 10%;
    height: 100%;
    background: #102a43; /* Steel Blue */
    border-left: 1px solid #00a8cc; /* Radar Cyan */
    color: #e6f2ff; /* Soft Naval White */
    font-size: 8px;
    padding: 15px;
    box-sizing: border-box;
}

/* Section Headers */
#sensorPanel h3 {
    margin-top: 0;
    font-size: 10px;
    text-align: center;
    border-bottom: 1px solid #00a8cc;
    padding-bottom: 8px;
    color: #ffd700; /* Naval Gold */
    letter-spacing: 1px;
}

/* Data Lines */
.dataLine {
    margin-bottom: 12px;
    word-wrap: break-word;
}

/* Status Colors */
.red { color: #ff3b3b; font-weight: bold; }
.yellow { color: #ffb703; font-weight: bold; }
.green { color: #2ec4b6; font-weight: bold; }

/* MINI MAP */
#miniMap {
    position: absolute;
    bottom: 20px;
    right: 20px;
    width: 220px;
    height: 120px;
    border: 3px solid #00a8cc;
    border-radius: 8px;
    overflow: hidden;
    z-index: 1000;
    box-shadow: 0 0 12px rgba(0,168,204,0.4);
}

#miniMap.fullscreen {
    width: 100vw;
    height: 100vh;
    bottom: 0;
    right: 0;
    border-radius: 0;
    border: none;
}

/* Route iframe */
#routeFrame {
    width: 100%;
    height: 100%;
    border: none;
}

/* Expand / Close Buttons */
#closeMap {
    position: absolute;
    top: 20px;
    left: 20px;
    background: #1e3a5f;
    color: #ffd700;
    border: none;
    padding: 10px 14px;
    display: none;
    z-index: 2000;
    cursor: pointer;
}

#expandMap {
    position: absolute;
    bottom: 60px;
    right: 20px;
    background: #1e3a5f;
    color: #ffd700;
    border: none;
    padding: 8px 10px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    z-index: 2000;
}

#expandMap:hover,
#closeMap:hover {
    background: #ffd700;
    color: #0b1c2d;
}

/* ===========================
   FULLSCREEN ROUTE PANEL
=========================== */

#routePanelHost {
    position: absolute;
    top: 80px;
    left: 20px;
    background: rgba(16, 42, 67, 0.95); /* Dark Steel Blue */
    color: #e6f2ff;
    padding: 12px;
    border-radius: 8px;
    z-index: 3000;
    display: none;
    width: 200px;
    border: 1px solid #00a8cc;
}

#routePanelHost input {
    width: 100%;
    margin-bottom: 6px;
    padding: 4px;
    background: #0b1c2d;
    border: 1px solid #00a8cc;
    color: #e6f2ff;
    border-radius: 4px;
}

#routePanelHost button {
    width: 100%;
    margin-top: 4px;
    padding: 6px;
    border: none;
    background: #1e3a5f;
    color: #ffd700;
    cursor: pointer;
    font-weight: bold;
    border-radius: 4px;
}

#routePanelHost button:hover {
    background: #ffd700;
    color: #0b1c2d;
}

/* Show panel ONLY in fullscreen */
#miniMap.fullscreen ~ #routePanelHost {
    display: block;
}

/* Follow Button */
#followBtnHost {
    position: absolute;
    top: 20px;
    right: 120px;
    background: #1e3a5f;
    color: #ffd700;
    border: none;
    padding: 8px 12px;
    font-weight: bold;
    cursor: pointer;
    z-index: 3000;
    display: none;
    border-radius: 4px;
}

#followBtnHost:hover {
    background: #ffd700;
    color: #0b1c2d;
}

#miniMap.fullscreen ~ #followBtnHost {
    display: block;
}
</style>
</head>

<script>
let objects = [];

// Fetch detected objects
function updateObjects() {
    fetch("/objects")
        .then(res => res.json())
        .then(data => {
            objects = data;
        });
}
setInterval(updateObjects, 300);

// Click detection with proper scaling
document.getElementById("videoStream").addEventListener("click", function(event) {

    const rect = this.getBoundingClientRect();

    const displayWidth = rect.width;
    const displayHeight = rect.height;

    const actualWidth = this.naturalWidth;
    const actualHeight = this.naturalHeight;

    const scaleX = actualWidth / displayWidth;
    const scaleY = actualHeight / displayHeight;

    const clickX = (event.clientX - rect.left) * scaleX;
    const clickY = (event.clientY - rect.top) * scaleY;

    objects.forEach(obj => {
        if (clickX >= obj.x1 && clickX <= obj.x2 &&
            clickY >= obj.y1 && clickY <= obj.y2) {

            console.log("Clicked object ID:", obj.id);

            fetch("/select_object", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({id: obj.id})
            });
        }
    });
});

// Update sensor panel
function updateSensorData() {
    fetch("/sensor_data")
        .then(res => res.json())
        .then(data => {
            


            // // OWN SHIP
            // document.getElementById("own_heading").innerText =
            //     data.own_heading ? data.own_heading.toFixed(1) : "-";

            // document.getElementById("own_speed").innerText =
            //     data.own_speed ? data.own_speed.toFixed(1) : "-";
            
            // ACTION
            document.getElementById("recommended_action").innerText =
                data.recommended_action || "-";
            // Identification
            document.getElementById("id").innerText = data.id || "-";
            document.getElementById("class").innerText = data.class || "-";
            document.getElementById("mmsi").innerText = data.mmsi || "-";
            document.getElementById("navy_type").innerText = data.navy_type || "-";

            // Bearings
            document.getElementById("bearing_degree").innerText =
                data.bearing_degree ? data.bearing_degree.toFixed(1) : "-";

            document.getElementById("bearing_relative_degree").innerText =
                data.bearing_relative_degree ? data.bearing_relative_degree.toFixed(1) : "-";

            // Motion
            document.getElementById("speed").innerText =
                data.speed ? data.speed.toFixed(1) : "-";

            document.getElementById("course").innerText =
                data.course ? data.course.toFixed(1) : "-";

            // Tactical
            document.getElementById("range").innerText =
                data.range ? data.range.toFixed(1) : "-";

            document.getElementById("cpa").innerText =
                data.cpa ? data.cpa.toFixed(1) : "-";

            document.getElementById("threat").innerText = data.threat || "-";

            // Collision Status (Color Coding)
            let collisionElem = document.getElementById("collision");
            collisionElem.innerText = data.collision || "-";
            collisionElem.className = "";

            if (data.collision === "RED")
                collisionElem.classList.add("red");
            else if (data.collision === "YELLOW")
                collisionElem.classList.add("yellow");
            else
                collisionElem.classList.add("green");
        });
}
setInterval(updateSensorData, 500);

const mini = document.getElementById("miniMap");
const expand = document.getElementById("expandMap");
const close = document.getElementById("closeMap");

expand.onclick = () => {
    mini.classList.add("fullscreen");
    expand.style.display = "none";
    close.style.display = "block";
};

close.onclick = () => {
    mini.classList.remove("fullscreen");
    close.style.display = "none";
    expand.style.display = "block";
};

function enterFullscreen() {
    const elem = document.documentElement;

    if (elem.requestFullscreen) {
        elem.requestFullscreen();
    } else if (elem.webkitRequestFullscreen) { // Safari
        elem.webkitRequestFullscreen();
    } else if (elem.msRequestFullscreen) { // IE
        elem.msRequestFullscreen();
    }
}



// =============================
// MINI MAP ADVANCED CONTROLS
// =============================

const frame = document.getElementById("routeFrame");
const startLatHost = document.getElementById("startLatHost");
const startLngHost = document.getElementById("startLngHost");
const endLatHost = document.getElementById("endLatHost");
const endLngHost = document.getElementById("endLngHost");
const followBtn = document.getElementById("followBtnHost");

let followState = false;

// FOLLOW BUTTON
followBtn.onclick = () => {
  followState = !followState;

  frame.contentWindow.postMessage(
    { type: followState ? "FOLLOW_ON" : "FOLLOW_OFF" },
    "*"
  );

  followBtn.innerHTML = followState ? "🎯 Following" : "🧭 Free Pan";

  frame.contentWindow.postMessage(
    { type: "FOLLOW_ZOOM", zoom: followState ? 7 : 5 },
    "*"
  );
};

// RECEIVE MAP CLICK EVENTS FROM IFRAME
window.addEventListener("message", (e) => {
  const msg = e.data;

  if (msg.type === "MAP_START_SELECTED") {
    startLatHost.value = msg.lat.toFixed(5);
    startLngHost.value = msg.lng.toFixed(5);
  }

  if (msg.type === "MAP_END_SELECTED") {
    endLatHost.value = msg.lat.toFixed(5);
    endLngHost.value = msg.lng.toFixed(5);
  }
});

// GENERATE ROUTE
document.getElementById("generateRouteHost").onclick = () => {
  const sLat = parseFloat(startLatHost.value);
  const sLng = parseFloat(startLngHost.value);
  const eLat = parseFloat(endLatHost.value);
  const eLng = parseFloat(endLngHost.value);

  if ([sLat, sLng, eLat, eLng].some(isNaN)) return;

  frame.contentWindow.postMessage(
    {
      type: "MANUAL_ROUTE",
      start: [sLng, sLat],
      end: [eLng, eLat],
    },
    "*"
  );
};

// CLEAR ROUTE
document.getElementById("clearRouteHost").onclick = () => {
  frame.contentWindow.postMessage({ type: "CLEAR_ROUTE" }, "*");

  startLatHost.value = "";
  startLngHost.value = "";
  endLatHost.value = "";
  endLngHost.value = "";
};

function fetchOwnShipFromBackend() {

fetch("/own_ship")
    .then(response => response.json())
    .then(data => {

        const displayDiv = document.getElementById("own_ship_display");

        displayDiv.innerHTML = `
            Latitude: ${data.lat ?? "-"} <br>
            Longitude: ${data.lon ?? "-"} <br>
            Heading: ${data.heading_deg_T ?? "-"} °T <br>
            COG: ${data.cog_deg ?? "-"} ° <br>
            Speed: ${data.sog_kts ?? "-"} kts <br>
            ROT: ${data.rate_of_turn ?? "-"} <br>
            Last Update: ${data.last_update 
                ? new Date(data.last_update * 1000).toLocaleTimeString() 
                : "-"}
        `;
    })
    .catch(error => {
        document.getElementById("own_ship_display").innerText =
            "Error fetching own ship data";
        console.error(error);
    });
}
