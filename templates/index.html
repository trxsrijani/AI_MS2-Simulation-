<!DOCTYPE html>
<html>
<head>
<title>Naval Tactical Display</title>

<style>
body {
    margin: 0;
    background: black;
    overflow: hidden;
    display: flex;
    height: 100vh;
}

/* LEFT SIDE - VIDEO (90%) */
#videoContainer {
    width: 90%;
    height: 100%;
}

#videoStream {
    width: 100%;
    height: 100%;
    object-fit: contain; /* IMPORTANT - no weird cropping */
    background: black;
}

/* RIGHT SIDE - SENSOR PANEL (10%) */
#sensorPanel {
    width: 10%;
    height: 100%;
    background: #000;
    border-left: 1px solid #00ffcc;
    color: #00ffcc;
    font-family: monospace;
    font-size: 12px;
    padding: 15px;
    box-sizing: border-box;
}

#sensorPanel h3 {
    margin-top: 0;
    font-size: 14px;
    text-align: center;
    border-bottom: 1px solid #00ffcc;
    padding-bottom: 8px;
}

.dataLine {
    margin-bottom: 12px;
    word-wrap: break-word;
}

.red { color: red; font-weight: bold; }
.yellow { color: yellow; font-weight: bold; }
.green { color: #00ffcc; }

#miniMap {
    position: absolute;
    bottom: 20px;
    right: 20px;
    width: 320px;
    height: 220px;
    border: 3px solid #00ffcc;
    border-radius: 8px;
    overflow: hidden;
    z-index: 1000;
}

#miniMap.fullscreen {
    width: 100vw;
    height: 100vh;
    bottom: 0;
    right: 0;
    border-radius: 0;
    border: none;
}

#routeFrame {
    width: 100%;
    height: 100%;
    border: none;
}

#closeMap {
    position: absolute;
    top: 20px;
    left: 20px;
    background: #00ff88;
    border: none;
    padding: 10px 14px;
    display: none;
    z-index: 2000;
}

#expandMap {
    position: absolute;
    bottom: 90px;
    right: 20px;
    background: #00ff88;
    border: none;
    padding: 8px 10px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    z-index: 2000;
}

</style>
</head>

<body>

<div id="videoContainer">
    <img id="videoStream" src="{{ url_for('video') }}">
</div>

<div id="miniMap">
    <iframe id="routeFrame" src="http://192.168.0.175:5002/"></iframe>
</div>

<button id="expandMap">⛶</button>
<button id="closeMap" style="display:none;">←</button>

<div id="sensorPanel">
    <h3>TARGET DATA</h3>

    <div class="dataLine">ID: <span id="id">-</span></div>
    <div class="dataLine">Class: <span id="class">-</span></div>
    <div class="dataLine">MMSI: <span id="mmsi">-</span></div>
    <div class="dataLine">Navy Type: <span id="navy_type">-</span></div>

    <div class="dataLine">Bearing (True): <span id="bearing_degree">-</span> °</div>
    <div class="dataLine">Bearing (Relative): <span id="bearing_relative_degree">-</span> °</div>

    <div class="dataLine">Speed: <span id="speed">-</span> kts</div>
    <div class="dataLine">Course: <span id="course">-</span> °T</div>

    <div class="dataLine">Range: <span id="range">-</span> m</div>
    <div class="dataLine">CPA: <span id="cpa">-</span> m</div>

    <div class="dataLine">Threat: <span id="threat">-</span></div>
    <div class="dataLine">Collision: <span id="collision">-</span></div>

</div>

<script>
let objects = [];

// Fetch detected objects
function updateObjects() {
    fetch("/objects")
        .then(res => res.json())
        .then(data => {
            objects = data;
        });
}
setInterval(updateObjects, 300);

// Click detection with proper scaling
document.getElementById("videoStream").addEventListener("click", function(event) {

    const rect = this.getBoundingClientRect();

    const displayWidth = rect.width;
    const displayHeight = rect.height;

    const actualWidth = this.naturalWidth;
    const actualHeight = this.naturalHeight;

    const scaleX = actualWidth / displayWidth;
    const scaleY = actualHeight / displayHeight;

    const clickX = (event.clientX - rect.left) * scaleX;
    const clickY = (event.clientY - rect.top) * scaleY;

    objects.forEach(obj => {
        if (clickX >= obj.x1 && clickX <= obj.x2 &&
            clickY >= obj.y1 && clickY <= obj.y2) {

            console.log("Clicked object ID:", obj.id);

            fetch("/select_object", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({id: obj.id})
            });
        }
    });
});

// Update sensor panel
function updateSensorData() {
    fetch("/sensor_data")
        .then(res => res.json())
        .then(data => {

            // Identification
            document.getElementById("id").innerText = data.id || "-";
            document.getElementById("class").innerText = data.class || "-";
            document.getElementById("mmsi").innerText = data.mmsi || "-";
            document.getElementById("navy_type").innerText = data.navy_type || "-";

            // Bearings
            document.getElementById("bearing_degree").innerText =
                data.bearing_degree ? data.bearing_degree.toFixed(1) : "-";

            document.getElementById("bearing_relative_degree").innerText =
                data.bearing_relative_degree ? data.bearing_relative_degree.toFixed(1) : "-";

            // Motion
            document.getElementById("speed").innerText =
                data.speed ? data.speed.toFixed(1) : "-";

            document.getElementById("course").innerText =
                data.course ? data.course.toFixed(1) : "-";

            // Tactical
            document.getElementById("range").innerText =
                data.range ? data.range.toFixed(1) : "-";

            document.getElementById("cpa").innerText =
                data.cpa ? data.cpa.toFixed(1) : "-";

            document.getElementById("threat").innerText = data.threat || "-";

            // Collision Status (Color Coding)
            let collisionElem = document.getElementById("collision");
            collisionElem.innerText = data.collision || "-";
            collisionElem.className = "";

            if (data.collision === "RED")
                collisionElem.classList.add("red");
            else if (data.collision === "YELLOW")
                collisionElem.classList.add("yellow");
            else
                collisionElem.classList.add("green");
        });
}
setInterval(updateSensorData, 500);

const mini = document.getElementById("miniMap");
const expand = document.getElementById("expandMap");
const close = document.getElementById("closeMap");

expand.onclick = () => {
    mini.classList.add("fullscreen");
    expand.style.display = "none";
    close.style.display = "block";
};

close.onclick = () => {
    mini.classList.remove("fullscreen");
    close.style.display = "none";
    expand.style.display = "block";
};

function enterFullscreen() {
    const elem = document.documentElement;

    if (elem.requestFullscreen) {
        elem.requestFullscreen();
    } else if (elem.webkitRequestFullscreen) { // Safari
        elem.webkitRequestFullscreen();
    } else if (elem.msRequestFullscreen) { // IE
        elem.msRequestFullscreen();
    }
}

// Trigger on first click anywhere
document.addEventListener("click", function enableFS() {
    enterFullscreen();
    document.removeEventListener("click", enableFS);
});
</script>

</body>
</html>
